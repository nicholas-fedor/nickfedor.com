# nickfedor.com Hugo Configuration

# Hugo and the Hextra theme documentation references are provided, if possible.
# https://gohugo.io/configuration/introduction/
# https://imfing.github.io/hextra/docs/guide/configuration/

baseURL: https://nickfedor.com/
locale: en-us
title: nickfedor.com

# https://gohugo.io/configuration/menus/
# https://imfing.github.io/hextra/docs/guide/configuration/#menu
menus:
  main:
    - name: Blog
      pageRef: /blog
      weight: 1
    - name: Projects
      pageRef: /projects
      weight: 2
    - name: Websites
      pageRef: /websites
      weight: 2
    - name: About
      pageRef: /about
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/nicholas-fedor"
      params:
        icon: github
    - name: Twitter
      weight: 6
      url: "https://twitter.com/NickFedor_"
      params:
        icon: x-twitter
    - name: Reddit
      weight: 7
      url: "https://www.reddit.com/user/nick_fedor"
      params:
        icon: reddit
    - name: LinkedIn
      weight: 8
      url: "https://www.linkedin.com/in/nick-fedor"
      params:
        icon: linkedin

# https://gohugo.io/configuration/module/
# https://imfing.github.io/hextra/docs/getting-started/#configure-hextra-theme-via-module
module:
  imports:
    - path: github.com/imfing/hextra

# https://gohugo.io/configuration/params/
params:
  description: "Nick Fedor's personal website"

  # https://imfing.github.io/hextra/docs/guide/configuration/#page-edit-link
  editURL:
    enable: true
    base: "https://github.com/nicholas-fedor/nickfedor.com/edit/main"

  # https://imfing.github.io/hextra/docs/guide/configuration/#external-link-decoration
  externalLinkDecoration: true

  # https://imfing.github.io/hextra/docs/guide/configuration/#footer
  footer:
    displayCopyright: true
    displayPoweredBy: false

  # https://imfing.github.io/hextra/docs/guide/syntax-highlighting/#copy-button
  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  # https://imfing.github.io/hextra/docs/guide/configuration/#image-zoom
  imageZoom:
    enable: true

  # https://imfing.github.io/hextra/docs/guide/configuration/#logo-and-title
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg

  # https://imfing.github.io/hextra/docs/guide/configuration/#theme-configuration
  theme:
    default: dark
    displayToggle: false
